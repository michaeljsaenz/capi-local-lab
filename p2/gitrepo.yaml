apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: apps
  # IMPORTANT: this GitRepo lives in the SAME namespace as the DOWNSTREAM
  # Fleet cluster object. CAAPF (cluster-api-addon-provider-fleet) registers
  # CAPI workload clusters as fleet.cattle.io/Cluster objects in the namespace
  # where the CAPI Cluster lives (here: `default`). A GitRepo can only target
  # clusters in its own namespace, so this MUST be `default` (not fleet-local,
  # which is where the management cluster's own GitRepo lives).
  namespace: default
spec:
  # Local git daemon serving the repo parent dir over git://.
  # host.docker.internal resolves to the host machine from inside pods.
  # Substituted at apply time from $CANONICAL_REPO (default in p0/scripts/bootstrap.sh).
  repo: git://host.docker.internal/${CANONICAL_REPO}

  # Fleet clones a COMMITTED git ref, not your working tree. This branch MUST be
  # the branch you commit app changes to, and every path below MUST be committed
  # on it. Substituted at apply time from $GIT_BRANCH via envsubst, e.g.
  #     export CANONICAL_REPO=capi-local-lab
  #     export GIT_BRANCH=$(git branch --show-current)
  #     envsubst < p2/gitrepo.yaml | kubectl apply -f -
  branch: ${GIT_BRANCH}

  # App manifests to deliver to the downstream cluster(s).
  paths:
  - p2/apps/hello-world

  disablePolling: false

  # Deploy to every registered downstream cluster labeled environment=local.
  # CAAPF copies the CAPI Cluster's labels onto the Fleet Cluster object, so the
  # `environment: local` label from cluster.yaml is what we select on here.
  targets:
  - name: local-clusters
    clusterSelector:
      matchLabels:
        environment: local

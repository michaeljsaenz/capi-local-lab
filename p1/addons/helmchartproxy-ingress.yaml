apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  name: nginx-ingress
  namespace: default
spec:
  clusterSelector:
    matchLabels:
      ingress: nginx
  repoURL: http://${CHART_SERVER_IP}:8879
  chartName: ingress-nginx
  releaseName: ingress-nginx
  namespace: ingress-nginx
  version: "4.10.0"
  options:
    waitForJobs: true
    wait: true
    timeout: 10m
    install:
      createNamespace: true
  valuesTemplate: |
    controller:
      kind: DaemonSet
      hostPort:
        enabled: true
      service:
        type: NodePort
      publishService:
        enabled: false
      metrics:
        enabled: true
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10254"